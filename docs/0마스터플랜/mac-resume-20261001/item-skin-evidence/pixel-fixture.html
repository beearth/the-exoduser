<!doctype html><meta charset="utf-8"><base href="/"><title>아이템 스킨 픽셀 후보 비교</title><style>body{background:#16171b;color:#eee;font:18px sans-serif;padding:24px}canvas{width:128px;height:128px;background:#303039;margin:5px}section{display:flex;align-items:center}</style><h1>전체 스킨: 기본 / 읽기 최적화 힌트 픽셀 비교</h1><p id="status">검사 중</p><main id="grid"></main><script>function _maskWorldDropBlack(canvas){
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  try{
    const data=ctx.getImageData(0,0,canvas.width,canvas.height),px=data.data;
    for(let i=0;i<px.length;i+=4){
      const light=Math.max(px[i],px[i+1],px[i+2]);
      if(light<=24)px[i+3]=0;
      else if(light<72)px[i+3]=Math.round(px[i+3]*(light-24)/48);
    }
    ctx.putImageData(data,0,0);
  }catch(_maskErr){}
  return canvas;
}

(async()=>{const results=[];for(const name of ["arcane_dark", "arcane_earth", "arcane_holy", "arcane_ice", "arcane_light", "arcane_phys", "armor_dark", "armor_earth", "armor_holy", "armor_ice", "armor_light", "armor_phys", "axe_dark", "axe_earth", "axe_holy", "axe_ice", "axe_light", "axe_phys", "belt_dark", "belt_earth", "belt_holy", "belt_ice", "belt_light", "belt_phys", "bone_arms", "bone_legs", "bone_skull", "bone_torso", "boots_dark", "boots_earth", "boots_holy", "boots_ice", "boots_light", "boots_phys", "bracelet_dark", "bracelet_earth", "bracelet_holy", "bracelet_ice", "bracelet_light", "bracelet_phys", "cape_dark", "cape_earth", "cape_holy", "cape_ice", "cape_light", "cape_phys", "club_dark", "club_earth", "club_holy", "club_ice", "club_light", "club_phys", "crossbow_dark", "crossbow_earth", "crossbow_holy", "crossbow_ice", "crossbow_light", "crossbow_phys", "dagger_dark", "dagger_earth", "dagger_holy", "dagger_ice", "dagger_light", "dagger_phys", "earring_dark", "earring_earth", "earring_holy", "earring_ice", "earring_light", "earring_phys", "gloves_dark", "gloves_earth", "gloves_holy", "gloves_ice", "gloves_light", "gloves_phys", "hammer_dark", "hammer_earth", "hammer_holy", "hammer_ice", "hammer_light", "hammer_phys", "helmet_dark", "helmet_earth", "helmet_holy", "helmet_ice", "helmet_light", "helmet_phys", "mace_dark", "mace_earth", "mace_holy", "mace_ice", "mace_light", "mace_phys", "necklace_dark", "necklace_earth", "necklace_holy", "necklace_ice", "necklace_light", "necklace_phys", "ossuary_phys", "pants_dark", "pants_earth", "pants_holy", "pants_ice", "pants_light", "pants_phys", "repeater_dark", "repeater_earth", "repeater_holy", "repeater_ice", "repeater_light", "repeater_phys", "ring_dark", "ring_earth", "ring_holy", "ring_ice", "ring_light", "ring_phys", "shield_dark", "shield_earth", "shield_holy", "shield_ice", "shield_light", "shield_phys", "spear_dark", "spear_earth", "spear_holy", "spear_ice", "spear_light", "spear_phys", "sword_dark", "sword_earth", "sword_holy", "sword_ice", "sword_light", "sword_phys"]){const im=new Image();im.src='output/imagegen/item-skins/'+name+'.png';await im.decode();const row=document.createElement('section');const label=document.createElement('span');label.textContent=name;row.append(label);const versions=[];for(const cpu of [false,true]){const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const t=performance.now();c.getContext('2d',cpu?{willReadFrequently:true}:undefined).drawImage(im,0,0);_maskWorldDropBlack(c);versions.push({canvas:c,ms:performance.now()-t});row.append(c);}const a=versions[0].canvas.getContext('2d').getImageData(0,0,im.naturalWidth,im.naturalHeight).data,b=versions[1].canvas.getContext('2d').getImageData(0,0,im.naturalWidth,im.naturalHeight).data;let changed=0,maxDelta=0,alphaChanged=0;for(let i=0;i<a.length;i++){if(a[i]!==b[i]){changed++;if(i%4===3)alphaChanged++;}maxDelta=Math.max(maxDelta,Math.abs(a[i]-b[i]));}results.push({name,w:im.naturalWidth,h:im.naturalHeight,bytes:a.length,changed,maxDelta,alphaChanged,baselineMs:versions[0].ms,cpuMs:versions[1].ms});if(['repeater_phys','hammer_phys','ring_light','belt_phys'].includes(name)||changed)grid.append(row);await new Promise(r=>setTimeout(r,0));}window.results=results;status.textContent=results.every(r=>r.changed===0)?'PASS: 모든 바이트 동일':'REJECT: 픽셀 차이 있음';document.getElementById('status').textContent=results.every(r=>r.changed===0)?'PASS: 모든 바이트 동일':'REJECT: 픽셀 차이 있음';})().catch(e=>document.getElementById('status').textContent=String(e));</script>
