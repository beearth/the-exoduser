<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="1080" viewBox="0 0 3840 1080" font-family="Cinzel, 'Hahmlet', serif">
  <!-- 전투 HUD 3840×1080(32:9) 배치도. 2026-11-05 레인 U1.
       규칙: 구체·스킬판 묶음은 가운데 16:9(1920×1080) 안에 고정(UI_FOUNDATION_20260924.md:342, 2026-10-31 사용자 정정).
       화면 가장자리 요소(미니맵·목표·레벨)는 실제 화면 끝을 따른다. 21:9(2520) 경계도 함께 표시.
       좌표: 시안 A 묶음 폭 1061(구체 바깥~바깥), B 1159. 받침 레일 윗면 y=1066, 구체 바닥 y=1070. -->
  <rect width="3840" height="1080" fill="#121511"/>
  <rect x="0" y="0" width="3840" height="1080" fill="none" stroke="#4f5352" stroke-width="4"/>
  <!-- 21:9 경계 -->
  <rect x="660" y="2" width="2520" height="1076" fill="none" stroke="#6b6964" stroke-width="2" stroke-dasharray="14 10"/>
  <text x="676" y="40" fill="#a7a49d" font-size="26" letter-spacing="4">21:9 · 2520×1080</text>
  <!-- 16:9 가운데 -->
  <rect x="960" y="2" width="1920" height="1076" fill="rgba(201,199,195,.04)" stroke="#c9c7c3" stroke-width="3"/>
  <text x="976" y="40" fill="#e6e3dc" font-size="26" letter-spacing="4">16:9 CENTER · 1920×1080 (HUD 묶음 고정 영역)</text>
  <text x="16" y="40" fill="#a7a49d" font-size="26" letter-spacing="4">32:9 · 3840×1080</text>

  <!-- 시안 A 묶음: 구체 중심 x 1920±435.5, y 975, 바깥 지름 190; 판 x 1565.5~2274.5, y 992~1066 -->
  <g>
    <rect x="1389.5" y="1066" width="1061" height="14" fill="#18181b" stroke="#8a8b88" stroke-width="1.5"/>
    <rect x="1565.5" y="992" width="709" height="74" fill="#141416" stroke="#c9c7c3" stroke-width="2"/>
    <circle cx="1484.5" cy="975" r="95" fill="#2a0604" stroke="#c9c7c3" stroke-width="3"/>
    <circle cx="2355.5" cy="975" r="95" fill="#16212e" stroke="#c9c7c3" stroke-width="3"/>
    <text x="1920" y="1036" fill="#e6e3dc" font-size="22" text-anchor="middle" letter-spacing="3">A · 13 SLOTS · 44px</text>
  </g>
  <!-- 시안 B 외곽(점선): 묶음 폭 1159, 구체 지름 212, 중심 x 1920±473.5, y 964 -->
  <g fill="none" stroke="#a7a49d" stroke-width="2" stroke-dasharray="8 6">
    <circle cx="1446.5" cy="964" r="106"/><circle cx="2393.5" cy="964" r="106"/>
    <rect x="1536.5" y="982" width="767" height="84"/><rect x="1845" y="966" width="150" height="16"/>
  </g>
  <text x="1920" y="940" fill="#a7a49d" font-size="20" text-anchor="middle" letter-spacing="3">B (dashed) · 1159 wide</text>
  <!-- 치수선 -->
  <g stroke="#8a8b88" stroke-width="1.5">
    <line x1="1389.5" y1="850" x2="2450.5" y2="850"/><line x1="1389.5" y1="840" x2="1389.5" y2="860"/><line x1="2450.5" y1="840" x2="2450.5" y2="860"/>
  </g>
  <text x="1920" y="836" fill="#c9c7c3" font-size="20" text-anchor="middle">A 1061 · 16:9 폭의 55% · 32:9 폭의 28%</text>

  <!-- 화면 끝 요소(실제 화면 끝 기준, 이번 범위 밖·위치만) -->
  <g fill="none" stroke="#6b6964" stroke-width="2">
    <circle cx="3700" cy="140" r="110"/>
    <rect x="3420" y="280" width="390" height="150"/>
    <rect x="30" y="70" width="420" height="70"/>
  </g>
  <text x="3700" y="146" fill="#a7a49d" font-size="20" text-anchor="middle">MINIMAP (edge)</text>
  <text x="3615" y="360" fill="#a7a49d" font-size="20" text-anchor="middle">OBJECTIVE (edge)</text>
  <text x="240" y="112" fill="#a7a49d" font-size="20" text-anchor="middle">REGION / LEVEL (edge)</text>

  <!-- 금지: 묶음을 32:9 폭으로 늘리기, 검은 판·블러 채움 -->
  <text x="1920" y="560" fill="#6b6964" font-size="24" text-anchor="middle" letter-spacing="2">HUD 묶음은 늘리지 않는다 · 양옆은 월드 그대로(검은 판·블러 채움 금지, CLAUDE.md 4.2-4)</text>
  <text x="1920" y="600" fill="#6b6964" font-size="22" text-anchor="middle">16:9 · 21:9 · 32:9 모두 같은 묶음 좌표(가운데 기준 오프셋)로 성립</text>
</svg>
