<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EXODUSER 고유아이템 원화 비교</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111017; color: #eee8f5; }
    body { margin: 0; padding: 24px; }
    header { max-width: 1400px; margin: 0 auto 20px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 12px; color: #c8bed3; line-height: 1.5; }
    button { padding: 8px 14px; margin-right: 8px; border: 1px solid #9771ba; border-radius: 6px; background: #241a32; color: #fff; cursor: pointer; }
    button[aria-pressed="true"] { background: #67478c; }
    main { max-width: 1400px; margin: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--card-width), 1fr)); gap: 12px; }
    body[data-size="64"] { --image-size: 64px; --card-width: 230px; }
    body[data-size="160"] { --image-size: 160px; --card-width: 380px; }
    article { padding: 12px; border: 1px solid #453451; border-radius: 8px; background: #1b1622; }
    h2 { margin: 0 0 9px; font-size: 15px; color: #d9b6f4; }
    .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    figure { margin: 0; min-width: 0; }
    figcaption { margin-bottom: 5px; font-size: 12px; color: #c9bdcf; }
    img { width: var(--image-size); height: var(--image-size); max-width: 100%; display: block; object-fit: contain; image-rendering: auto; border: 1px solid #594566; background: #151019; }
    footer { max-width: 1400px; margin: 20px auto; color: #b8a9c4; font-size: 13px; }
  </style>
</head>
<body data-size="64">
  <header>
    <h1>고유아이템 원화 비교 · UI-01~22</h1>
    <p>왼쪽은 기존 원화, 오른쪽은 MagicLight Seedream 후보입니다. 64px은 슬롯 가독성, 160px은 구조와 재질 확인용입니다. 후보는 아직 게임에 적용되지 않았습니다.</p>
    <button type="button" data-target="64" aria-pressed="true">64px 슬롯</button>
    <button type="button" data-target="160" aria-pressed="false">160px 구조</button>
  </header>
  <p id="review-status" role="status">정의를 불러오는 중입니다. 표시되지 않으면 HTTP로 이 개발 검토 화면을 열고 definitions.js 경로를 확인하세요.</p>
  <main id="items" aria-busy="true"></main>
  <footer>원본 보존 경로: assets/unique-items/. 배경이 포함된 RGB 원화이므로 투명 아이콘·월드 드롭에 바로 쓰지 않습니다.</footer>
  <script>
    const main = document.getElementById('items');
    const status = document.getElementById('review-status');
    const slotNames = { cape: '망토', ring1: '반지 1', ring2: '반지 2', weapon: '무기', gloves: '장갑', boots: '장화', helmet: '투구', belt: '허리띠', bracelet: '팔찌', armor: '흉갑', shield: '견갑', necklace: '목걸이', bow: '활', headband: '귀걸이 1', headband2: '귀걸이 2' };
    const weaponNames = { sword: '검', dagger: '단검', hammer: '해머', crossbow: '석궁' };
    function appendDefinition(definition) {
      const article = document.createElement('article');
      article.dataset.uniqueId = definition.uniqueId;
      const heading = document.createElement('h2');
      heading.textContent = `${definition.uniqueId} · ${definition.catalogName}`;
      const equipment = document.createElement('p');
      equipment.className = 'equipment';
      const type = definition.wtype || definition.btype;
      equipment.textContent = `장착: ${definition.slots.map(slot => slotNames[slot] || slot).join(' / ')}${type ? ' · ' + (weaponNames[type] || type) : ''}`;
      const effect = document.createElement('p');
      effect.className = 'effect';
      effect.textContent = `효과 제안: ${definition.effectId} · ${definition.effectStatus === 'unimplemented' ? '미구현' : definition.effectStatus}`;
      const state = document.createElement('p');
      state.className = 'proposal-state';
      state.textContent = `정의: ${definition.status === 'proposal' ? '제안·미채택' : definition.status} · ${definition.enabled ? '활성' : '비활성'} · 원화: ${definition.art.accepted ? '채택' : '미채택'}`;
      const pair = document.createElement('div');
      pair.className = 'pair';
      for (const [label, path] of [['기존 원화', definition.art.originalPath], ['Seedream 후보', definition.art.candidatePath]]) {
        const figure = document.createElement('figure');
        const caption = document.createElement('figcaption');
        caption.textContent = label;
        const img = document.createElement('img');
        img.src = `../${path}`;
        img.alt = `${definition.uniqueId} ${definition.catalogName} ${label}`;
        img.loading = 'lazy';
        figure.append(caption, img);
        pair.append(figure);
      }
      article.append(heading, equipment, effect, state, pair);
      main.append(article);
    }
    for (const button of document.querySelectorAll('button[data-target]')) {
      button.addEventListener('click', () => {
        document.body.dataset.size = button.dataset.target;
        for (const other of document.querySelectorAll('button[data-target]')) other.setAttribute('aria-pressed', String(other === button));
      });
    }
    import('./definitions.js').then(({ UNIQUE_DEFINITIONS }) => {
      for (const definition of UNIQUE_DEFINITIONS) appendDefinition(definition);
      status.textContent = `${UNIQUE_DEFINITIONS.length}종 정의 · 개발 검토용입니다. 게임 등록·아트 채택 판정이 아닙니다.`;
    }).catch(() => {
      status.textContent = '정의를 불러오지 못했습니다. HTTP로 화면을 열고 definitions.js 경로와 모듈 응답을 확인하세요. 게임 적용이나 채택은 수행하지 않았습니다.';
      status.setAttribute('role', 'alert');
    }).finally(() => {
      main.setAttribute('aria-busy', 'false');
    });
  </script>
</body>
</html>
