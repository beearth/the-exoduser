<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전사 인트로 · 접촉 컷 교정 검토본</title><style>body{margin:0;background:#13110f;color:#eee7df;font:16px/1.6 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:24px 16px}h1{font-size:clamp(22px,4vw,32px);margin:0 0 12px}p{max-width:70ch}video{display:block;width:100%;aspect-ratio:16/9;background:#000}video::cue{background:transparent;color:#fff;text-shadow:0 2px 3px #000;font-size:24px}button,a{color:inherit}button{background:#342b24;border:1px solid #80664c;border-radius:7px;padding:9px 14px;cursor:pointer}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.badge{color:#dca76f;font-size:13px}small{color:#bdb1a6}@media(max-width:600px){video::cue{font-size:14px}main{padding:16px 10px}}</style><main><div class="badge">FDG · AI 보조 시네마틱 제작 기록 · 공개 전 검토본</div><h1>머리를 맞댄 컷을 덜어내고, 대검 전투로.</h1><p>81~84초의 접촉 장면을 제외했습니다. 다음 대검 컷을 길게 보여주며 원래 내레이션·음악과 자막 타이밍을 유지했습니다.</p><video id="movie" controls playsinline preload="metadata" src="EXODUSER_WARRIOR_INTRO_CONTACT_CUT_V1_20261016_REVIEW.mp4"></video><div class="controls"><button id="whole" type="button">처음부터</button><button id="change" type="button">수정 전후 연결 · 79초</button><button id="ko" type="button">한국어</button><button id="en" type="button">English</button><button id="off" type="button">자막 끄기</button></div><p><a href="EXODUSER_WARRIOR_INTRO_CONTACT_CUT_78-90s_20261016_REVIEW.mp4">수정 구간 12초 영상만 보기</a></p><small>대검 컷을 약 0.54배속으로 조정한 편집안입니다. 전편 시청·실제 청취와 사용자 검토는 남아 있습니다. 게임 플레이나 공개 데모 패치 영상이 아닙니다.</small></main><script>const DATA={"ko": [{"id": "wa02", "start": 1.0, "end": 3.21, "text": "전쟁에서 살아 돌아온 한 남자."}, {"id": "wa04", "start": 5.5, "end": 7.51, "text": "하지만 집은 모두 불타 사라졌다."}, {"id": "wa06", "start": 10.0, "end": 14.03, "text": "이웃이자 친구였던 킬루가 그의 가문을 짓밟았다."}, {"id": "wa08", "start": 16.0, "end": 20.43, "text": "아내는 몸종으로 끌려가 온갖 몹쓸 짓을 당했고,"}, {"id": "wa09", "start": 22.5, "end": 25.33, "text": "끝내 못 이겨 스스로 목숨을 끊었다."}, {"id": "wa11", "start": 28.0, "end": 32.05, "text": "아이들은 노예로 팔려가 어디에 있는지조차 알 수 없다."}, {"id": "wa12", "start": 33.5, "end": 36.85, "text": "늙은 부모는 감옥에 갇혀 굶어 죽었다."}, {"id": "wa14", "start": 39.0, "end": 41.51, "text": "킬루 가문의 모두가 알고 있었다."}, {"id": "wa15", "start": 42.24, "end": 45.15, "text": "31명이 보고도 못 본 척했다."}, {"id": "wa17", "start": 46.5, "end": 49.05, "text": "그날 밤, 킬루 가문을 모두 죽였다."}, {"id": "wa19", "start": 51.0, "end": 53.41, "text": "칼로 킬루의 팔다리를 자르고"}, {"id": "wa20", "start": 53.48, "end": 55.69, "text": "불로 지혈까지 해주며"}, {"id": "wa21", "start": 56.02, "end": 59.03, "text": "오래오래 살려두었다."}, {"id": "wa22_23", "start": 59.5, "end": 62.43, "text": "\"기억하라.\"\n\"그리고 지옥에서도 후회하라.\""}, {"id": "wa24", "start": 65.0, "end": 66.51, "text": "그리고 지옥에 떨어진다."}, {"id": "wa26", "start": 70.67, "end": 73.86, "text": "\"...이것은 셀 수 없는 복수자 중 하나의 이야기일 뿐.\""}, {"id": "wa28", "start": 76.0, "end": 79.45, "text": "\"지옥의 미로에는 매일 새로운 영혼이 떨어진다.\""}, {"id": "wa29", "start": 81.5, "end": 87.41, "text": "\"분노로 가득 찬 자, 억울함에 미친 자, 사랑을 잃은 자...\""}, {"id": "wa31", "start": 88.0, "end": 90.333, "text": "\"너는 왜 지옥에 왔느냐?\""}, {"id": "wa33a", "start": 90.333, "end": 91.395, "text": "\"지옥을 탈출하라.\""}, {"id": "wa33b", "start": 92.9, "end": 95.6, "text": "\"죄의 무게를 짊어진 자여.\""}], "en": [{"id": "wa02", "start": 1.0, "end": 3.21, "text": "A man who returned alive from war."}, {"id": "wa04", "start": 5.5, "end": 7.51, "text": "But his home had burned to nothing."}, {"id": "wa06", "start": 10.0, "end": 14.03, "text": "Killu, once a neighbor and friend, had crushed his family."}, {"id": "wa08", "start": 16.0, "end": 20.43, "text": "His wife was taken as a servant and suffered unspeakable horrors,"}, {"id": "wa09", "start": 22.5, "end": 25.33, "text": "until she could bear no more and took her own life."}, {"id": "wa11", "start": 28.0, "end": 32.05, "text": "His children were sold into slavery — their fate unknown."}, {"id": "wa12", "start": 33.5, "end": 36.85, "text": "His elderly parents were imprisoned and starved to death."}, {"id": "wa14", "start": 39.0, "end": 41.51, "text": "Everyone in the Killu household knew."}, {"id": "wa15", "start": 42.24, "end": 45.15, "text": "Thirty-one of them saw everything and looked away."}, {"id": "wa17", "start": 46.5, "end": 49.05, "text": "That night, he killed every last one of them."}, {"id": "wa19", "start": 51.0, "end": 53.41, "text": "He cut off Killu's limbs with a blade,"}, {"id": "wa20", "start": 53.48, "end": 55.69, "text": "cauterized the wounds with fire,"}, {"id": "wa21", "start": 56.02, "end": 59.03, "text": "and kept him alive for a long, long time."}, {"id": "wa22_23", "start": 59.5, "end": 62.43, "text": "\"Remember.\"\n\"And regret it even in hell.\""}, {"id": "wa24", "start": 65.0, "end": 66.51, "text": "And so he fell into hell."}, {"id": "wa26", "start": 70.67, "end": 73.86, "text": "\"...This is but one tale among countless avengers.\""}, {"id": "wa28", "start": 76.0, "end": 79.45, "text": "\"Every day, new souls fall into hell's labyrinth.\""}, {"id": "wa29", "start": 81.5, "end": 87.41, "text": "\"Those consumed by rage, driven mad by injustice, those who lost love...\""}, {"id": "wa31", "start": 88.0, "end": 90.333, "text": "\"Why have you come to hell?\""}, {"id": "wa33a", "start": 90.333, "end": 91.395, "text": "\"Escape from hell.\""}, {"id": "wa33b", "start": 92.9, "end": 95.6, "text": "\"You... who bear the weight of sin.\""}]};const v=document.getElementById('movie');const tracks={};for(const lang of ['ko','en']){const t=v.addTextTrack('subtitles',lang==='ko'?'한국어':'English',lang);for(const c of DATA[lang]){const cue=new VTTCue(c.start,c.end,c.text);cue.id=c.id;cue.snapToLines=false;cue.line=matchMedia('(max-width:600px)').matches?56:75;cue.lineAlign='center';cue.position=50;cue.align='center';t.addCue(cue)}t.mode=lang==='ko'?'showing':'disabled';tracks[lang]=t}function show(lang){for(const k of Object.keys(tracks))tracks[k].mode=k===lang?'showing':'disabled'}for(const k of ['ko','en','off'])document.getElementById(k).addEventListener('click',()=>show(k));document.getElementById('whole').addEventListener('click',()=>{v.pause();v.currentTime=0});document.getElementById('change').addEventListener('click',()=>{v.pause();v.currentTime=79});</script></html>
