<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>생체숲 v6 레이어</title>
<style>body{margin:0;background:#131014;color:#dfd7d9;font:16px system-ui}header{position:sticky;top:0;z-index:2;padding:14px;background:#201b22;display:flex;gap:22px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}a{color:#d6ac81}.map{position:relative;max-width:1600px;margin:auto}.map img{display:block;width:100%}.map .layer{position:absolute;inset:0;pointer-events:none}</style>
<header><h1>썩은 생체숲 · 디테일 레이어</h1><label><input id="left" type="checkbox" checked> 왼쪽 나무</label><label><input id="right" type="checkbox" checked> 오른쪽 나무</label><a href="rottenwood_living_hell_v6.png">합성본</a><a href="rottenwood_living_hell_v6_layers.svg">레이어 SVG</a><span>체크를 끄면 v5 원본과 비교됩니다.</span></header>
<div class="map"><img src="rottenwood_living_hell_v5.png" alt="v5 원본"><img id="left-layer" class="layer" src="rottenwood_living_hell_v6_left_layer.png" alt="왼쪽 나무 디테일"><img id="right-layer" class="layer" src="rottenwood_living_hell_v6_right_layer.png" alt="오른쪽 나무 디테일"></div>
<script>for(const id of ['left','right'])document.getElementById(id).addEventListener('change',e=>{document.getElementById(id+'-layer').hidden=!e.target.checked;document.getElementById(id+'-layer').style.display=e.target.checked?'block':'none'});</script></html>
