<!doctype html><html lang="ko"><meta charset="utf-8"><title>생체숲 v7 구역 레이어</title><style>body{margin:0;background:#151216;color:#e4d8d8;font:16px system-ui}header{position:sticky;top:0;z-index:5;background:#221e25;padding:15px;display:flex;gap:20px;flex-wrap:wrap}.map{position:relative;max-width:1600px;margin:auto}img{width:100%;display:block}.overlay{position:absolute;inset:0}a{color:#e0b590}</style><header><strong>생체숲 v7</strong><label><input type="checkbox" checked data-layer="0">피부 지면 변화</label><label><input type="checkbox" checked data-layer="1">괴사 구덩이</label><label><input type="checkbox" checked data-layer="2">쓰러진 생체 고목</label><label><input type="checkbox" checked data-layer="3">북문 동맥 조직</label><a href="rottenwood_living_hell_v7.png">합성본</a></header><div class="map"><img src="rottenwood_living_hell_v6.png" alt="v6 원본"><img id="layer0" class="overlay" src="rottenwood_living_hell_v7_ground_layer.png" alt="피부 지면 변화"><img id="layer1" class="overlay" src="rottenwood_living_hell_v7_left_layer.png" alt="괴사 구덩이"><img id="layer2" class="overlay" src="rottenwood_living_hell_v7_right_layer.png" alt="쓰러진 생체 고목"><img id="layer3" class="overlay" src="rottenwood_living_hell_v7_north_layer.png" alt="북문 동맥 조직"></div><script>document.querySelectorAll('input[data-layer]').forEach(input=>input.addEventListener('change',()=>{document.getElementById('layer'+input.dataset.layer).style.display=input.checked?'block':'none'}));</script></html>
