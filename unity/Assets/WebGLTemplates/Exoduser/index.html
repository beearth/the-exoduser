<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>EXODUSER</title>
    <link rel="icon" href="data:,">
    <style>
      :root {
        --iron: #0e0c0b;
        --bone: #dfd6c2;
        --bone-dim: rgba(223, 214, 194, .62);
        --gold-hair: rgba(164, 147, 115, .5);
        --gold: rgb(164, 147, 115);
        --ember: #8f2a17;
        --font-hell: "Nanum Myeongjo", "Noto Serif KR", "Noto Serif CJK KR", "Batang", "Georgia", "Times New Roman", serif;
        --font-title: "Cinzel", "Trajan Pro", "Georgia", "Times New Roman", serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--iron); color: var(--bone); font-family: var(--font-hell); }
      #unity-wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--iron); }
      #unity-wrap:fullscreen { width: 100vw; height: 100vh; }
      /* 16:9 stage: as large as fits the window, the rest stays iron */
      #unity-stage { position: relative; width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); background: #000; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #000; outline: none; }

      #unity-loading-container { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 58%, #1a1311 0%, var(--iron) 62%); }
      #unity-loading-bar { width: min(460px, 70%); text-align: center; }
      #unity-load-title { font-family: var(--font-title); font-size: clamp(22px, 3.2vw, 40px); letter-spacing: .42em; padding-left: .42em; color: var(--bone); text-shadow: 0 0 18px rgba(143, 42, 23, .55), 0 1px 0 #000; }
      #unity-load-rule { height: 1px; margin: 16px auto 26px; width: 58%; background: linear-gradient(90deg, transparent, var(--gold-hair), transparent); }
      #unity-progress-bar-empty { position: relative; height: 5px; border: 1px solid var(--gold-hair); background: rgba(0, 0, 0, .55); }
      #unity-progress-bar-full { height: 100%; width: 0; background: linear-gradient(90deg, rgba(164, 147, 115, .35), var(--gold)); box-shadow: 0 0 8px rgba(164, 147, 115, .35); transition: width .18s linear; }
      #unity-load-text { display: flex; justify-content: space-between; margin-top: 12px; font-size: 13px; letter-spacing: .12em; color: var(--bone-dim); }
      #unity-load-pct { font-family: var(--font-title); color: var(--bone); font-variant-numeric: lining-nums tabular-nums; }

      #unity-fullscreen-button { position: fixed; right: 12px; bottom: 12px; width: 26px; height: 26px; border: 1px solid var(--gold-hair); background: rgba(14, 12, 11, .6); cursor: pointer; opacity: .55; transition: opacity .15s; z-index: 4; }
      #unity-fullscreen-button:hover { opacity: 1; }
      #unity-fullscreen-button::before, #unity-fullscreen-button::after { content: ""; position: absolute; width: 7px; height: 7px; border: solid var(--bone); }
      #unity-fullscreen-button::before { left: 5px; top: 5px; border-width: 1px 0 0 1px; }
      #unity-fullscreen-button::after { right: 5px; bottom: 5px; border-width: 0 1px 1px 0; }

      #unity-warning { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); display: none; z-index: 5; max-width: 80vw; }
      #unity-warning div { margin-bottom: 6px; padding: 8px 14px; background: rgba(14, 12, 11, .92); border: 1px solid var(--gold-hair); color: var(--bone); font-size: 13px; }
      #unity-warning div.error { border-color: var(--ember); }

      /* portrait / phone windows: use the whole screen */
      @media (max-aspect-ratio: 1/1) { #unity-stage { width: 100vw; height: 100vh; } }
    </style>
  </head>
  <body>
    <div id="unity-wrap">
      <div id="unity-stage">
        <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-load-title">EXODUSER</div>
            <div id="unity-load-rule"></div>
            <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
            <div id="unity-load-text"><span>불러오는 중</span><span id="unity-load-pct">0%</span></div>
          </div>
        </div>
      </div>
    </div>
    <div id="unity-warning"></div>
    <div id="unity-fullscreen-button" title="전체 화면"></div>
    <script>
      let canvas = document.querySelector("#unity-canvas");

      // Banners (warnings/errors) in the dark palette; errors stay until reload.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() { warningBanner.style.display = warningBanner.children.length ? 'block' : 'none'; }
        var div = document.createElement('div');
        div.textContent = msg;
        if (type == 'error') div.className = 'error';
        warningBanner.appendChild(div);
        if (type != 'error') {
          setTimeout(function() { warningBanner.removeChild(div); updateBannerVisibility(); }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        fullscreenElementID: "unity-wrap",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");
        const pct = document.querySelector("#unity-load-pct");
        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "flex";
            progressBarFull.style.width = (100 * progress) + "%";
            pct.textContent = Math.floor(100 * progress) + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => {
          document.querySelector("#unity-fullscreen-button").onclick = () => { unityInstance.SetFullscreen(1); };
        }).catch((message) => {
          unityShowBanner(String(message), 'error');
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
