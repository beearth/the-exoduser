<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wa24 컷 미리보기</title>
<!--
  ART-20261002-WA24-PREVIEW — 독립 컷 미리보기 (읽기 전용 진단 도구)
  - 실제 원화 wa23/24/25 (assets/cutscene/warintro/) 를 그대로 사용.
  - 엔진 실제 변환(clip→zoom→shake→cover→fade, game.html:60737-60807)을 캔버스에 재현.
  - canonical predictFinalCrop(wa24-finalcrop.mjs)의 crop 분수 공식을 인라인 포팅해 대조(일치 표시).
  - wa24 진입/중간/출구 3시점 고정 버튼 + 뷰포트비 버튼. 캔버스 실좌표/이미지 해상도 표시.
  * 새 관측기 아님. 생성/다운로드/게임/인코딩/엔진상태변경 없음. 에셋 read-only.
  * native 실화면 인수는 root. 실제 컷신 PASS 아님(기하/변환 미리보기까지).
-->
<style>
  :root{
    --bg:#0c0a09; --panel:rgba(20,16,14,.82); --bone:#dfd6c2; --dim:#9b8f78;
    --gold:rgba(164,147,115,.5); --hell:#c0392b; --ok:#8fae6b; --warn:#d8a24a;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--bone);font:14px/1.5 'Noto Sans KR',system-ui,sans-serif;padding:16px}
  h1{font:600 18px/1.3 Cinzel,serif;letter-spacing:.04em;margin:0 0 4px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:14px}
  .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  .bar .lbl{color:var(--dim);font-size:12px;margin-right:4px;min-width:62px}
  button{background:#17120f;color:var(--bone);border:1px solid var(--gold);border-radius:4px;
    padding:6px 11px;font:13px 'Noto Sans KR',sans-serif;cursor:pointer}
  button:hover{border-color:var(--hell)}
  button.on{background:#2a1512;border-color:var(--hell);color:#fff}
  .wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  .stage{flex:1 1 640px;min-width:320px}
  canvas{width:100%;height:auto;background:#000;border:1px solid var(--gold);display:block}
  .cap{color:var(--dim);font-size:11px;margin-top:4px}
  .info{flex:1 1 300px;min-width:280px;background:var(--panel);border:1px solid var(--gold);border-radius:6px;padding:12px}
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
  td{padding:3px 4px;border-bottom:1px solid rgba(164,147,115,.15);vertical-align:top}
  td.k{color:var(--dim);white-space:nowrap;width:44%}
  td.v{color:var(--bone);word-break:break-all}
  .match-ok{color:var(--ok)} .match-bad{color:var(--hell)}
  .note{color:var(--warn);font-size:11px;margin-top:8px;line-height:1.45}
  .unk{color:var(--warn)}
</style>
</head>
<body>
  <h1>wa24 컷 미리보기 — 진입 / 중간 / 출구</h1>
  <div class="sub">실제 원화 + 엔진 변환(clip→zoom→shake→cover→fade) 재현. canonical predictFinalCrop 분수 대조. 읽기 전용 진단.</div>

  <div class="bar">
    <span class="lbl">컷</span>
    <button data-cut="wa23">wa23 (remember)</button>
    <button data-cut="wa24" data-el="400" class="on">wa24 · 진입(400ms)</button>
    <button data-cut="wa24" data-el="1200">wa24 · 중간(1200ms)</button>
    <button data-cut="wa24" data-el="2399">wa24 · 출구(2399ms)</button>
    <button data-cut="wa25">wa25 (블랙)</button>
  </div>
  <div class="bar">
    <span class="lbl">뷰포트</span>
    <button data-vp="1920x1080" class="on">16:9 · 1920×1080</button>
    <button data-vp="2560x1080">21:9 · 2560×1080</button>
    <button data-vp="1920x1200">16:10 · 1920×1200</button>
    <button data-vp="1024x768">4:3 · 1024×768</button>
  </div>
  <div class="bar">
    <span class="lbl">오버레이</span>
    <button id="btnGuide" class="on">크롭 가이드 ON</button>
    <button id="btnFade">fade 적용 ON</button>
  </div>

  <div class="wrap">
    <div class="stage">
      <canvas id="cv" width="1920" height="1080"></canvas>
      <div class="cap" id="cap">—</div>
    </div>
    <div class="info">
      <table id="tbl"></table>
      <div class="note" id="note"></div>
    </div>
  </div>

<script>
'use strict';
// ── 엔진 상수 복제 (game.html:60313 _ease, :60627 _cutShake) ──
const EASE = { linear:t=>t, in:t=>t*t, out:t=>1-(1-t)*(1-t), inout:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2 };
function cutShake(mag,t){ return mag?{x:(Math.sin(t*0.047)*mag*2)|0, y:(Math.cos(t*0.053)*mag*2)|0}:{x:0,y:0}; }

// ── 실제 라인 데이터 (game.html:60342-60344) ──
const LINES = {
  wa23:{ id:'wa23', img:'cin_remember.jpg', dur:5400, narr:1, col:'#ff4422', text:'"그리고 지옥에서도 후회하라."',
         cam:{zs:1.04,ze:1.04}, vfx:{vig:.5}, fade:{type:'cross',in:1} },
  wa24:{ id:'wa24', img:'cin_fallhell_custom.jpg', dur:2400, narr:1, col:undefined, text:'그리고 지옥에 떨어진다.',
         cam:{zs:1.08,ze:1.04,ease:'out'}, vfx:{vig:.5,shake:1}, fade:{type:'cross',in:400} },
  wa25:{ id:'wa25', img:null, dur:2900, narr:1, col:undefined, text:'',
         cam:{zs:1,ze:1}, vfx:{vig:.5}, fade:{type:'cross',in:400} }
};
// 에셋 경로 (미리보기 폴더 기준 repo root). ?assets= 쿼리로 override 가능.
const BASE = new URLSearchParams(location.search).get('assets') || '../../../../assets/cutscene/warintro/';
const ENGINE_QUERY = '?v=20261001-warstills2'; // 엔진 로더 실제 쿼리(표시용). 로컬 로드엔 생략.

const imgCache = {};
function loadImg(file){
  if(!file) return null;
  if(imgCache[file]) return imgCache[file];
  const im = new Image();
  im.onload = ()=>render();
  im.onerror = ()=>{ im.__err=true; render(); };
  im.src = BASE + file;
  imgCache[file] = im;
  return im;
}

// ── 레터박스 (game.html:60742-60746) ──
function letterbox(fullW, fullH){
  const maxAR=16/9, curAR=fullW/fullH; let lbX=0,lbY=0,cw=fullW,ch=fullH;
  if(curAR>maxAR){cw=~~(fullH*maxAR); lbX=~~((fullW-cw)/2);}
  else if(curAR<9/16){ch=~~(fullW/(9/16)); lbY=~~((fullH-ch)/2);}
  return {cw,ch,lbX,lbY,letterboxed:(cw!==fullW||ch!==fullH)};
}
// ── fade (game.html:60769-60773) ──
function fadeAlpha(le,dur,fi,fo){ fi=fi||400; fo=fo||0; let a=1; if(le<fi)a=le/fi; if(fo&&le>dur-fo)a=Math.min(a,(dur-le)/fo); return Math.max(0,Math.min(1,a)); }

// ── canonical predictFinalCrop 포팅 (wa24-finalcrop.mjs = owner-integration predictFinalCrop) ──
// 모듈 import 대신 동일 공식 인라인(브라우저에서 .cjs 혼용 회피). 엔진 실측 drawRect 와 대조용.
function canonicalFinal(fullW, fullH, line, el, natW, natH){
  const clampF=v=>Math.max(0,Math.min(1,v));
  const lb=letterbox(fullW,fullH), {cw,ch,lbX,lbY}=lb;
  const cam=line.cam||{zs:1,ze:1};
  const progress=Math.min(1, el/(line.dur||1));
  const eased=(EASE[cam.ease||'linear']||EASE.linear)(progress);
  const zoom=cam.zs+(cam.ze-cam.zs)*eased;
  const now=el; // lineStartMs=0 → now=el (결정적)
  const shake=cutShake((line.vfx||{}).shake||0, now);
  const tX=lbX+cw/2+(cam.px||0)*eased+shake.x-zoom*cw/2;
  const tY=lbY+ch/2+(cam.py||0)*eased+shake.y-zoom*ch/2;
  const imageRatio=natW/natH, fitHeight=imageRatio>cw/ch;
  const dw=fitHeight?ch*imageRatio:cw, dh=fitHeight?ch:cw/imageRatio;
  const dx=fitHeight?(cw-dw)/2:0, dy=fitHeight?0:(ch-dh)*0.1;
  const drawRect={x:tX+zoom*dx, y:tY+zoom*dy, w:zoom*dw, h:zoom*dh};
  const clip={x:lbX,y:lbY,w:cw,h:ch};
  const fr={
    left:clampF((clip.x-drawRect.x)/drawRect.w),
    right:clampF((drawRect.x+drawRect.w-clip.x-clip.w)/drawRect.w),
    top:clampF((clip.y-drawRect.y)/drawRect.h),
    bottom:clampF((drawRect.y+drawRect.h-clip.y-clip.h)/drawRect.h)
  };
  return {zoom,shake,eased,fadeAlpha:fadeAlpha(el,line.dur,(line.fade||{}).in,(line.fade||{}).out),
          letterbox:lb,clip,drawRect,fractions:fr,
          geometryVerdict:Object.values(fr).some(v=>v>1e-12)?'CROPPED':'FULLFRAME_GEOMETRY'};
}

// ── 상태 ──
let STATE={ cut:'wa24', el:400, vp:[1920,1080], guide:true, applyFade:false };

const cv=document.getElementById('cv'), cx=cv.getContext('2d');
const tbl=document.getElementById('tbl'), cap=document.getElementById('cap'), note=document.getElementById('note');

function render(){
  const [fullW,fullH]=STATE.vp;
  cv.width=fullW; cv.height=fullH;
  const line=LINES[STATE.cut];
  const el=STATE.cut==='wa24'?STATE.el:Math.min(line.dur-1,1200);
  const now=el; // lineStartMs=0

  // 엔진 변환 실제 적용(행렬 누적으로 drawRect 도 산출) ──
  const lb=letterbox(fullW,fullH), {cw,ch,lbX,lbY}=lb;
  const fAlpha=STATE.applyFade?fadeAlpha(el,line.dur,(line.fade||{}).in,(line.fade||{}).out):1;
  const cam=line.cam||{zs:1,ze:1};
  const t=Math.min(1,el/(line.dur||1));
  const zoom=cam.zs+(cam.ze-cam.zs)*((EASE[cam.ease||'linear']||EASE.linear)(t));
  const sk=cutShake((line.vfx||{}).shake||0, now);

  cx.setTransform(1,0,0,1,0,0);
  cx.clearRect(0,0,fullW,fullH);
  cx.fillStyle='#000'; cx.fillRect(0,0,fullW,fullH); // 전체 흑
  cx.save();
  cx.beginPath(); cx.rect(lbX,lbY,cw,ch); cx.clip(); cx.translate(lbX,lbY);

  const im=line.img?loadImg(line.img):null;
  let natW=0,natH=0,drawRect=null,imgReady=false,imgErr=false;
  if(im){ imgErr=!!im.__err; imgReady=im.complete&&im.naturalWidth>0; if(imgReady){natW=im.naturalWidth;natH=im.naturalHeight;} }

  if(im&&imgReady){
    cx.save();
    cx.globalAlpha=fAlpha;
    cx.translate(cw/2+sk.x, ch/2+sk.y);
    cx.scale(zoom,zoom);
    cx.translate(-cw/2,-ch/2);
    const imgR=natW/natH, cR=cw/ch;
    let dw,dh,dx,dy;
    if(imgR>cR){dh=ch;dw=ch*imgR;dx=(cw-dw)/2;dy=0;} else {dw=cw;dh=cw/imgR;dx=0;dy=(ch-dh)*.1;}
    cx.drawImage(im,dx,dy,dw,dh);
    // drawRect(클립 로컬좌표계: translate(lbX,lbY) 이후). 행렬: translate(cw/2+sk)·scale(zoom)·translate(-cw/2)
    drawRect={ x: (cw/2+sk.x)+zoom*(-cw/2+dx), y:(ch/2+sk.y)+zoom*(-ch/2+dy), w:zoom*dw, h:zoom*dh };
    cx.restore();
    // vignette (game.html:60612-60616)
    const vig=(line.vfx||{}).vig||0;
    if(vig){ const g=cx.createRadialGradient(cw/2,ch/2,cw*.2,cw/2,ch/2,cw*.7); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,'+vig+')'); cx.fillStyle=g; cx.fillRect(0,0,cw,ch); }
  }

  // 나레이션 (game.html:60810-60843) — wa24: col 미지정 → 뼈색 #d8d4cc
  if(line.narr&&line.text){
    cx.fillStyle='rgba(0,0,0,0.35)'; cx.fillRect(0,0,cw,ch);
    cx.save(); cx.globalAlpha=fAlpha;
    cx.textAlign='center'; cx.textBaseline='middle';
    const nFs=Math.max(14,ch*.031);
    cx.font=(~~nFs)+'px "Noto Sans KR",sans-serif';
    cx.fillStyle=line.col||'#d8d4cc';
    cx.shadowColor='#000'; cx.shadowBlur=6; cx.shadowOffsetY=1;
    cx.fillText(line.text, cw*.5, ch*.88);
    cx.shadowColor='transparent'; cx.shadowBlur=0; cx.shadowOffsetY=0;
    cx.restore();
  }
  cx.restore();

  // 크롭 가이드 오버레이(클립 박스 + 잘림 영역 표시) — 원 렌더 위 별도
  const canon=(im&&imgReady)?canonicalFinal(fullW,fullH,line,el,natW,natH):null;
  if(STATE.guide){
    cx.save(); cx.setTransform(1,0,0,1,0,0);
    // 레터박스 바(있으면)
    cx.strokeStyle='rgba(164,147,115,.5)'; cx.lineWidth=Math.max(1,fullW/960);
    cx.strokeRect(lbX+.5,lbY+.5,cw-1,ch-1);
    if(canon){
      // 잘린 좌/우/상/하 폭을 클립 안쪽 붉은 반투명으로
      cx.fillStyle='rgba(192,57,43,.22)';
      const L=canon.fractions.left*cw, R=canon.fractions.right*cw, T=canon.fractions.top*ch, B=canon.fractions.bottom*ch;
      if(L>0.5) cx.fillRect(lbX,lbY,L,ch);
      if(R>0.5) cx.fillRect(lbX+cw-R,lbY,R,ch);
      if(T>0.5) cx.fillRect(lbX,lbY,cw,T);
      if(B>0.5) cx.fillRect(lbX,lbY+ch-B,cw,B);
    }
    cx.restore();
  }

  // 엔진 실측 fractions vs canonical 대조
  let matchHtml='—', drawRectStr='—', frEngine=null, maxDelta=null;
  if(canon&&drawRect){
    const clampF=v=>Math.max(0,Math.min(1,v));
    frEngine={
      left:clampF((0-drawRect.x)/drawRect.w),
      right:clampF((drawRect.x+drawRect.w-cw)/drawRect.w),
      top:clampF((0-drawRect.y)/drawRect.h),
      bottom:clampF((drawRect.y+drawRect.h-ch)/drawRect.h)
    };
    maxDelta=Math.max(
      Math.abs(frEngine.left-canon.fractions.left), Math.abs(frEngine.right-canon.fractions.right),
      Math.abs(frEngine.top-canon.fractions.top), Math.abs(frEngine.bottom-canon.fractions.bottom));
    matchHtml = maxDelta<1e-9
      ? '<span class="match-ok">일치 (Δ='+maxDelta.toExponential(1)+')</span>'
      : '<span class="match-bad">불일치 (Δ='+maxDelta.toExponential(2)+')</span>';
    drawRectStr='x '+drawRect.x.toFixed(1)+' y '+drawRect.y.toFixed(1)+' w '+drawRect.w.toFixed(1)+' h '+drawRect.h.toFixed(1);
  }

  const pct=f=>f?( (f.left+f.right)*100 ).toFixed(2)+'% 좌우 / '+( (f.top+f.bottom)*100 ).toFixed(2)+'% 상하':'—';
  const rows=[
    ['활성 컷', line.id+(STATE.cut==='wa24'?' · el='+el+'ms':'')],
    ['뷰포트(실픽셀)', fullW+' × '+fullH+'  (AR '+(fullW/fullH).toFixed(3)+')'],
    ['캔버스 logical', cv.width+' × '+cv.height],
    ['레터박스 콘텐츠박스', cw+' × '+ch+(lb.letterboxed?('  (lb '+lbX+','+lbY+')'):'  (없음)')],
    ['이미지 해상도', line.img?(imgReady?(natW+' × '+natH):(imgErr?'로드 실패':'로딩중…')):'null(블랙)'],
    ['엔진 로더 URL', line.img?('assets/cutscene/warintro/'+line.img+ENGINE_QUERY):'—'],
    ['zoom (Ken Burns)', (im&&imgReady)?zoom.toFixed(4)+'  ('+cam.zs+'→'+cam.ze+' '+(cam.ease||'linear')+')':'—'],
    ['shake (px, now='+now+')', '('+sk.x+', '+sk.y+')  ±2 정수'],
    ['fadeAlpha', (STATE.applyFade?fadeAlpha(el,line.dur,(line.fade||{}).in,(line.fade||{}).out).toFixed(3):'1.000 (fade off)')+'  fade.in='+((line.fade||{}).in||400)],
    ['cover drawRect(클립좌표)', drawRectStr],
    ['크롭 — 엔진 실측', pct(frEngine)],
    ['크롭 — canonical', pct(canon&&canon.fractions)],
    ['엔진 vs canonical', matchHtml],
    ['기하 판정', canon?canon.geometryVerdict:'—'],
    ['눈/발/자막 가독성', '<span class="unk">UNKNOWN</span> (픽셀 판독 필요)']
  ];
  tbl.innerHTML=rows.map(r=>'<tr><td class="k">'+r[0]+'</td><td class="v">'+r[1]+'</td></tr>').join('');
  cap.textContent=line.img?('원화 '+line.img+' · 엔진 변환 재현('+(STATE.applyFade?'fade 적용':'fade off, 전체 표시')+')'):'wa25 = img null → 블랙 전환';
  note.innerHTML='※ 엔진 crop·zoom·shake·fade 를 그대로 재현하고 canonical predictFinalCrop 분수와 대조합니다(동일 공식 → Δ≈0). '
    +'붉은 영역 = 잘려 안 보이는 원화 부분. wa24(16:9)는 Ken Burns 줌으로 상하 소폭 크롭됩니다. '
    +'<b>native 실화면 인수는 root</b>, 실제 컷신 PASS 아님(픽셀 가독성 UNKNOWN). 에셋 read-only.';
}

// ── 버튼 바인딩 ──
document.querySelectorAll('button[data-cut]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('button[data-cut]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); STATE.cut=b.dataset.cut; if(b.dataset.el)STATE.el=+b.dataset.el; render();
}));
document.querySelectorAll('button[data-vp]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('button[data-vp]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); STATE.vp=b.dataset.vp.split('x').map(Number); render();
}));
document.getElementById('btnGuide').addEventListener('click',function(){STATE.guide=!STATE.guide;this.classList.toggle('on',STATE.guide);this.textContent='크롭 가이드 '+(STATE.guide?'ON':'OFF');render();});
document.getElementById('btnFade').addEventListener('click',function(){STATE.applyFade=!STATE.applyFade;this.classList.toggle('on',STATE.applyFade);this.textContent='fade 적용 '+(STATE.applyFade?'ON':'OFF');render();});

render();
</script>
</body>
</html>
