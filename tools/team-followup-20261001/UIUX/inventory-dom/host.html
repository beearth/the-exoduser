<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>UIUX 인벤토리 독립 DOM 인수</title>
<style>body{font:16px sans-serif}#invPanel:not(.on){display:none}.inv-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#invGrid{position:relative}.inv-item{position:absolute}.inv-eq-slot{display:inline-block}:focus{outline:3px solid #ab7634}#invRight{min-height:180px}#invActionBtns{grid-column:3}</style>
<h1>인벤토리 DOM-only host</h1><p>생산 CSS·게임·저장·이미지·서버 시작 없음. 실제 브라우저 판정은 root만 기록합니다.</p>
<label>소스 <select id="source"><option>game.html</option><option>game-easy-test.html</option></select></label>
<label>후보 <select id="version"><option value="candidate">파생 후보</option><option value="baseline">원 inventory-focus</option></select></label>
<label>언어 <select id="language"><option value="ko">한국어</option><option value="en">English</option></select></label>
<button id="reset">다시 구성</button><button id="hover">실제 hover 종료</button><button id="rerender">실제 renderInv 재구성</button><button id="remove">fixture 선택 아이템 소멸</button><pre id="status" aria-live="polite"></pre><main id="mount"></main>
<script type="module">
import {sources} from './source-data.mjs';
import {createHost} from './harness.mjs';
const get=id=>document.getElementById(id);let ui;
function report(){get('status').textContent=JSON.stringify({scope:'독립 native DOM, 전체 게임 아님',source:get('source').value,sourceSha:sources[get('source').value].sourceSha256,version:get('version').value,active:document.activeElement?.id||document.activeElement?.className,inlineVisibility:ui.nodes.invRight.style.visibility,computedVisibility:getComputedStyle(ui.nodes.invRight).visibility},null,2);}
function reset(){ui=createHost(document,get('mount'),sources[get('source').value],get('version').value,get('language').value);ui.render();report();}
get('reset').onclick=reset;get('hover').onclick=()=>{ui.api._invClearHover();report();};get('rerender').onclick=()=>{ui.render();report();};get('remove').onclick=()=>{ui.env.INV.bag=[];ui.render();report();};
for(const id of ['hover','rerender','remove'])get(id).onmousedown=event=>event.preventDefault();
window.inventoryDomHarness=Object.freeze({get current(){return ui;},report,hover(){ui.api._invClearHover();report();},rerender(){ui.render();report();},remove(){ui.env.INV.bag=[];ui.render();report();}});
document.addEventListener('focusin',()=>queueMicrotask(report));document.addEventListener('keyup',()=>queueMicrotask(report));reset();
</script></html>
