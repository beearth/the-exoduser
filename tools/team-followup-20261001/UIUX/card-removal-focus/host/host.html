<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>UIUX native focus 인수 host</title>
<link id="production-css" rel="stylesheet" disabled>
<style>body{font:16px sans-serif}#invPanel:not(.on){display:none}.inv-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#invGrid{position:relative}.inv-item{position:absolute}.inv-eq-slot{display:inline-block}:focus{outline:3px solid #ab7634}#invRight{min-height:180px}#invActionBtns{grid-column:3}</style>
</head><body><h1>카드 소멸 Native DOM-only 인수</h1><p>기본 CSS 미연결·데이터 액션 차단. 실제 게임·저장·전투·외부 CDN 없음.</p>
<label>소스 <select id="source"><option>game.html</option><option>game-easy-test.html</option></select></label>
<label>후보 <select id="version"><option value="candidate">카드 소멸 수정</option><option value="baseline">직전 DOM 합본</option></select></label>
<label>언어 <select id="language"><option value="ko">한국어</option><option value="en">English</option></select></label>
<label><input type="checkbox" id="css-toggle">실제 inventory-space.css 연결</label>
<button id="reset">fixture 재설정</button><button id="hover">hover 종료</button><button id="rerender">renderInv 재구성</button><button id="remove">fixture 아이템 소멸</button>
<pre id="status" aria-live="polite">아직 로드되지 않음</pre><main id="mount"></main>
<script type="module" src="./controller.js"></script></body></html>
