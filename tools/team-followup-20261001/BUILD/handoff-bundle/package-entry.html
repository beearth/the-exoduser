<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>EXODUSER 시작 확인</title>
<body><p id="status">게임 서버 시작을 확인하고 있습니다.</p>
<script>
(() => {
  const status = document.getElementById('status');
  let consumed = false;
  let unsubscribe = () => {};
  function deny(message) { consumed = true; unsubscribe(); status.textContent = message; }
  try {
    const entry = require('node:process').__exoduserPackageEntry;
    if (!entry) return deny('서버 시작 상태를 확인할 수 없어 게임 진입을 차단했습니다.');
    function update(state) {
      if (consumed) return;
      if (state.phase === 'failed') return deny('서버 시작 실패: ' + state.host + ':' + state.port + ' / ' + state.code);
      if (state.phase !== 'ready') return;
      if (state.host !== '127.0.0.1' || ![3333, 3347].includes(state.port)) return deny('패키지 서버 계약이 일치하지 않아 게임 진입을 차단했습니다.');
      consumed = true; unsubscribe();
      location.replace('http://localhost:' + state.port + '/index.html?demo=1');
    }
    unsubscribe = entry.subscribe(update);
    update(entry.snapshot());
    addEventListener('pagehide', () => { consumed = true; unsubscribe(); }, { once: true });
  } catch (error) { deny('서버 상태 연결 실패로 게임 진입을 차단했습니다.'); }
})();
</script></body></html>
