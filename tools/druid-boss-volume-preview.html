<style>
:root{font-family:system-ui,"Apple SD Gothic Neo",sans-serif;color:#e8e6dc;background:#101310;--line:#ffffff20;--accent:#dccd9b;--muted:#a7ada0}*{box-sizing:border-box}body{margin:0;height:100dvh;min-width:340px;display:flex;flex-direction:column;overflow:hidden}header{padding:18px 24px 15px;border-bottom:1px solid var(--line);display:flex;gap:20px;align-items:center;justify-content:space-between}h1{font-size:20px;margin:3px 0 0;letter-spacing:-.04em}header small{font-size:10px;color:var(--accent);letter-spacing:.14em}header p{font-size:12px;line-height:1.7;color:var(--muted);margin:0;max-width:320px}.comparison{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}.panel{position:relative;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 50% 46%,#354034,#1b241d 55%,#101710)}.panel+.panel{border-left:1px solid var(--line)}.panel h2{position:absolute;top:17px;left:22px;z-index:1;margin:0;font-size:12px;font-weight:500;letter-spacing:.04em;color:#d8ddce;pointer-events:none}.reference{display:flex;align-items:center;justify-content:center}.reference img{display:block;height:87.719298%;width:auto;max-width:100%;object-fit:contain}canvas{display:block;width:100%;height:100%;touch-action:none}.badge{position:absolute;bottom:16px;left:22px;right:20px;font-size:11px;line-height:1.7;color:#aab5a2;pointer-events:none}.badge strong{color:#e2dcc3;font-weight:500}footer{flex-shrink:0;border-top:1px solid var(--line);padding:14px 24px 15px;display:grid;gap:10px;background:#141a15}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{font:inherit;font-size:12px;min-height:36px;padding:7px 13px;border:1px solid var(--line);border-radius:6px;color:#d6dfce;background:#222d24;cursor:pointer}button:hover:enabled{background:#334235}button[aria-pressed="true"]{border-color:#a89767;color:#f4e7bd;background:#3b3e2d}button:disabled,input:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px so <body>
<header><div><small>EXODUSER · DARK DRUID</small><h1>원본 외형 · 깊이 비교</h1></div><p>원본 그림의 형태와 색을 유지하는 정지 외형입니다. 공격 모션과 본편 연결은 아직 없습니다.</p></header>
<main class="comparison">
<section class="panel reference"><h2>기준 원본</h2><img id="original" alt="다크드루이드 원본: 비대칭 가지뿔과 긴 겹망토, 왼쪽 지팡이" src="../assets/sprites/boss/boss_dark_druid_f0.png"><div class="badge">기존 원화 <strong>355 × 541</strong></div></section>
<section class="panel" id="render-panel"><h2>원본 기반 2.5D 표면</h2><canvas id="viewport" aria-label="다크드루이드 원본 기반 깊이 모델"></canvas><div id="status" role="status">원본과 깊이 표면을 준비하고 있습니다.</div><div class="badge">정지 외형 비교 · <strong>모션 미구현</strong></div></section>
</main>
<footer><div class="toolbar" role="group" aria-label="깊이 비교 방향"><button type="button" data-angle="0" aria-pressed="true" disabled>정면</button><button type="button" data-angle="-22" aria-pressed="false" disabled>왼쪽 22°</button><button type="button" data-angle="22" aria-pressed="false" disabled>오른쪽 22°</button><label class="zoom" for="zoom">확대 <input id="zoom" type="range" min="75" max="150" value="100" step="5" disabled><output id="zoom-value" for="zoom">100%</output></label><span id="state">준비 중</span></div><p class="metrics" id="metrics">원본 실루엣과 비율을 비교합니다. 후면까지 완성된 입체 캐릭터가 아닙니다.</p><details><summary>렌더 구조</summary><pre id="snapshot">준비 중</pre></details></footer>
<script type="module">
const $=id=>document.getElementById(id),controls=[...document.querySelectorAll('[data-angle]'),$('zoom')];
const write=(id,value)=>{const n=$(id);if(n&&n.children.length===0)n.textContent=String(value);};
let disposed=false,failed=false,THREE=null,renderer=null,model=null,scene=null,camera=null,observer=null,raf=0,angle=0;
const original=$('original'),canvas=$('viewport'),panel=$('render-panel');
function schedule(){if(!raf&&!disposed&&!failed&&renderer&&!document.hidden)raf=requestAnimationFrame(render);}
function render(){raf=0;if(disposed||failed||!renderer)return;try{const w=Math.max(1,panel.clientWidth),h=Math.max(1,panel.clientHeight),view=1.14/(Number($('zoom').value)/100),aspect=w/h;renderer.setSize(w,h,false);camera.left=-view*aspect/2;camera.right=view*aspect/2;camera.top=view/2;camera.bottom=-view/2;const a=angle*Math.PI/180;camera.position.set(Math.sin(a)*2.8,.5,Math.cos(a)*2.8);camera.lookAt(0,.5,0);camera.updateProjectionMatrix();renderer.render(scene,camera);write('state',angle===0?'정지 외형 · 정면':`정지 외형 · ${angle}°`);write('snapshot',JSON.stringify({...model.snapshot(),renderedTriangles:renderer.info.render.triangles},null,2));}catch(error){fail(error);}}
function fail(error){if(disposed||failed)return;failed=true;if(raf)cancelAnimationFrame(raf);raf=0;controls.forEach(n=>n.disabled=true);$('status').hidden=false;write('status',error instanceof Error?error.message:String(error));write('state','로드 실패');}
for(const button of document.querySelectorAll('[data-angle]'))button.addEventListener('click',()=>{angle=Number(button.dataset.angle);for(const n of document.querySelectorAll('[data-angle]'))n.setAttribute('aria-pressed',String(n===button));schedule();});
$('zoom').addEventListener('input',()=>{write('zoom-value',`${$('zoom').value}%`);original.style.height=`${87.719298*Number($('zoom').value)/100}%`;schedule();});
function visibility(){if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0;}else schedule();}
document.addEventListener('visibilitychange',visibility);window.addEventListener('resize',schedule);canvas.addEventListener('webglcontextlost',event=>{event.preventDefault();fail(new Error('그래픽 연결이 끊겼습니다.'));});
function dispose(){if(disposed)return;disposed=true;if(raf)cancelAnimationFrame(raf);observer?.disconnect();document.removeEventListener('visibilitychange',visibility);window.removeEventListener('resize',schedule);model?.dispose();renderer?.dispose();controls.forEach(n=>n.disabled=true);}
window.addEventListener('pagehide',dispose,{once:true});
try{
 const loaded=await Promise.all([import('../assets/vendor/three-r160/build/three.module.js'),import('./2_5d/druid-original-relief.mjs?v=b29dba3352a56a37'),original.decode()]);
 if(!disposed){THREE=loaded[0];model=loaded[1].createDruidOriginalRelief({THREE,image:original,height:1});if(disposed){model.dispose();}else{scene=new THREE.Scene();scene.add(model.object3d);camera=new THREE.OrthographicCamera(-1,1,1,-1,.01,10);renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NoToneMapping;renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setClearColor(0,0);const snapshot=model.snapshot();write('snapshot',JSON.stringify(snapshot,null,2));write('metrics','원본 실루엣 유지 · 초기 1회 표면 생성 · 움직임/후면/본편 연결 미완료');write('state','정지 외형 · 검토 중');$('status').hidden=true;controls.forEach(n=>n.disabled=false);if(typeof ResizeObserver==='function'){observer=new ResizeObserver(schedule);observer.observe(panel);}schedule();}}
}catch(error){fail(error);model?.dispose();renderer?.dispose();model=null;renderer=null;}
</script>
