<!doctype html><html lang="ko"><meta charset="utf-8"><title>전사 가로 베기 비교</title>
<style>body{margin:36px;background:#13161b;color:#e6dfd2;font:17px system-ui}h1{font-size:26px}button,select{font:inherit;padding:8px;background:#292d34;color:inherit;border:1px solid #65615a}canvas{display:block;max-width:100%;background:#232831;margin:24px 0}p{color:#b5b0a8}a{color:#e5b36b}</style>
<h1>전사 · 양손 가로 베기</h1><p>검을 뒤로 당긴 뒤 몸을 돌려 베고, 반대편 어깨까지 마무리합니다.</p>
<select id="dir"><option value="1">남동</option><option value="0">남</option><option value="2">동</option><option value="3">북동</option><option value="4">북</option><option value="5">북서</option><option value="6">서</option><option value="7">남서</option></select>
<button id="pause">일시정지</button> <button id="step">한 프레임</button>
<canvas id="view" width="900" height="400"></canvas>
<p>왼쪽: 이전 동작　/　오른쪽: 새 가로 베기 · 확대 4배</p>
<a href="/game.html?test=1&amp;testchar=1&amp;slot=qa_warrior_bat_20260915">인게임에서 보기</a>
<script src="../warrior-bat-swing.js?v=20260915-speed85"></script>
<script>
const dirs=['south','south-east','east','north-east','north','north-west','west','south-west'];
const old=dirs.map(d=>{const i=new Image();i.src='../img/exoduser_warrior/'+d+'.png';return i;});
const next=new Image();next.src='../img/exoduser_warrior/attack-bat-v1.png?v=20260915-bat2';
const x=view.getContext('2d');let paused=false,tick=0,last=0;
pause.onclick=()=>{paused=!paused;last=performance.now();pause.textContent=paused?'재생':'일시정지';};step.onclick=()=>{paused=true;tick=(tick+1)%72;paint();};
function paint(){const d=+dir.value,state=tick<20?'sBash':'sRecover',left=tick<20?20-tick:Math.max(0,48-tick);const f=tick>=48?8:WarriorBatSwing.frame(state,left,10,28);const a=Math.min(1,tick/20),r=Math.min(1,Math.max(0,(tick-20)/28));const before=tick<20?(a<.4?Math.min(5,Math.floor(a/.4*6)):Math.min(7,6+Math.floor((a-.4)/.6*2))):r<.2?7:r<.55?1:0;x.clearRect(0,0,900,400);x.imageSmoothingEnabled=false;x.fillStyle='#e6dfd2';x.font='18px system-ui';x.fillText('이전',200,50);x.fillText('가로 베기',625,50);if(old[d].complete)x.drawImage(old[d],(10+before)*48,0,48,48,225-96,260-168,192,192);if(next.complete)x.drawImage(next,f*80,d*80,80,80,675-160,260-232,320,320);x.strokeStyle='#414851';x.beginPath();x.moveTo(60,260);x.lineTo(840,260);x.stroke();}
function loop(now){if(!paused&&now-last>=1000/60){const steps=Math.floor((now-last)/(1000/60));tick=(tick+steps)%72;last+=steps*(1000/60);}paint();requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></html>
