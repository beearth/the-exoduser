<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXODUSER · 원화 부위와 회전축</title>
<style>
:root{color-scheme:dark;font:14px/1.5 system-ui,sans-serif;background:#101319;color:#e9edf2}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{background:#242d39;color:#edf2f7;border:1px solid #405064;border-radius:6px;padding:7px 10px;cursor:pointer}button:hover:enabled{background:#344257}button:disabled,input:disabled{opacity:.42;cursor:default}button[aria-pressed=true],button[aria-current=true]{border-color:#eeb86c;background:#453626}input,textarea{background:#0e131b;color:#f4f5f7;border:1px solid #405064;border-radius:5px;padding:6px;min-width:0}input[type=range]{padding:0;accent-color:#eeb86c;width:100%}header{padding:17px 24px;border-bottom:1px solid #303b49;display:flex;gap:24px;align-items:center;justify-content:space-between}h1{font-size:20px;letter-spacing:.02em;margin:0}h2{font-size:12px;letter-spacing:.12em;color:#a9b7c9;margin:0 0 12px}p{margin:8px 0}a{color:#cfad78}main{display:grid;grid-template-columns:240px minmax(360px,1fr)290px;gap:1px;background:#303b49;min-height:680px}.panel{padding:18px;background:#161c25;min-width:0}.workspace{padding:16px;background:#111720;min-width:0}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:12px}.checker{background-color:#19212c;background-image:linear-gradient(45deg,#263140 25%,transparent 25%),linear-gradient(-45deg,#263140 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#263140 75%),linear-gradient(-45deg,transparent 75%,#263140 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;border:1px solid #3b485b;border-radius:8px;overflow:hidden}.source-box{height:390px}.stage{height:560px;touch-action:none}canvas{display:block;width:100%;height:100%}.field{display:grid;gap:5px;margin-bottom:12px}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.muted,.hint{color:#a9b7c9;font-size:12px}.hint{line-height:1.7}#part-list{display:grid;gap:6px;max-height:210px;overflow:auto;margin:12px 0}#part-list button{text-align:left}.wide{width:100%;margin-bottom:8px}.angle-head{display:flex;justify-content:space-between}.zoom{display:flex;align-items:center;gap:10px;margin-top:12px}.zoom input{max-width:260px}#notice{min-height:42px;color:#e7c38d}#notice[data-state=error]{color:#ffa4a4}#status{font:12px/1.5 ui-monospace,monospace;color:#a8c7d1;min-height:20px}footer{border-top:1px solid #303b49;padding:14px 24px;background:#161c25}footer .toolbar{margin-bottom:8px}details{margin-top:12px}textarea{display:block;width:100%;height:210px;margin:10px 0;resize:vertical}hr{border:0;border-top:1px solid #303b49;margin:16px 0}@media(max-width:1040px){main{grid-template-columns:190px minmax(320px,1fr)250px}.panel{padding:12px}.stage{height:530px}}@media(max-width:820px){header{align-items:flex-start;flex-direction:column;gap:8px}main{grid-template-columns:1fr}.source-box{height:280px}.stage{height:520px}.panel{padding:18px}}
</style>
</head>
<body>
<header><div><h1>원화 부위와 회전축</h1><p class="muted">EXODUSER · CUTOUT RIG</p></div><a href="./engine-sprite-editor.html">스프라이트 모션 편집기로</a></header>
<main>
<section class="panel" aria-label="원본"><h2>SOURCE · 원본</h2><div class="checker source-box" id="source-stage"><canvas id="source-view" aria-label="변형 없는 원본 첫 셀"></canvas></div><p>드루이드 · 정면 첫 셀</p><p class="muted">414 × 620 px</p><p class="hint">원형과 나눈 부위를 비교합니다. 드러난 빈 영역은 추가 원화가 필요합니다.</p></section>
<section class="workspace" aria-label="부위 작업 공간"><h2>WORKSPACE · 부위 지정</h2><div class="toolbar"><button id="mode-original" aria-pressed="true">원형 보기</button><button id="mode-edit" aria-pressed="false">편집 보기</button><button id="new-part">새 부위</button><button id="cancel-point">마지막 점 취소</button><button id="close-polygon">영역 닫기</button><button id="cancel-draft">지정 취소</button></div><div class="checker stage" id="stage"><canvas id="viewport" aria-label="원화 부위와 회전축 편집"></canvas></div><div class="zoom"><button id="fit">화면 맞춤</button><label for="zoom">확대</label><input id="zoom" type="range" min="25" max="200" step="5" value="100"><output id="zoom-value">100%</output></div><p id="status" role="status"></p></section>
<aside class="panel" aria-label="부위 속성"><h2>INSPECTOR · 부위와 회전축</h2><label class="field">리그 이름<input id="rig-name" type="text" maxlength="200"></label><div id="part-list" aria-label="부위 목록"></div><p id="part-summary" class="muted">부위 0 / 16</p><hr><label class="field">부위 이름<input id="part-name" type="text" maxlength="100" placeholder="예: 왼팔"></label><button id="pivot-mode" class="wide">회전축 지정</button><p id="pivot-value" class="muted">회전축 미지정</p><button id="save-part" class="wide">부위 저장</button><hr><div class="angle-head"><label for="angle">회전 미리보기</label><output id="angle-value">0°</output></div><input id="angle" type="range" min="-90" max="90" step="1" value="0"><div class="row"><label class="field">이동 X<input id="offset-x" type="number" min="-414" max="414" step="1" value="0"></label><label class="field">이동 Y<input id="offset-y" type="number" min="-620" max="620" step="1" value="0"></label></div><button id="reset-pose" class="wide">모든 부위 원형 복귀</button><button id="remove-part" class="wide">선택 부위 삭제</button><p id="notice" role="status"></p></aside>
</main>
<footer><div class="toolbar"><button id="undo">되돌리기</button><button id="redo">다시 실행</button><button id="export">리그 JSON 내려받기</button></div><details id="json-panel"><summary>리그 JSON · 가져오기</summary><textarea id="json" aria-label="컷아웃 리그 JSON" maxlength="1000000" spellcheck="false"></textarea><button id="import">JSON 적용</button><p class="hint">JSON은 이 도구에서 부위와 미리보기를 다시 열기 위한 파일입니다.</p></details></footer>
<script type="module" src="./engine-cutout-editor.mjs?v=20261009-v1"></script>
</body>
</html>
