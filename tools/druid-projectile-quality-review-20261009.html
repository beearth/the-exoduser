<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>드루이드 독탄 표시 검수</title><style>body{margin:0;background:#090e0b;color:#e6ece3;font:16px system-ui;padding:26px}h1{font-size:24px;margin:0 0 8px}p{color:#a8b5a8;margin:6px 0 18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:1480px}.panel{background:#101a13;border:1px solid #314336;border-radius:12px;padding:16px}h2{font-size:18px;margin:0 0 12px}canvas{width:100%;height:auto;display:block;border-radius:8px}label{margin-right:20px}input{vertical-align:middle}#status{color:#bddd9c}footer{color:#8d9e91;font-size:13px;margin-top:16px}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style><h1>드루이드 독탄 표시 검수</h1><p>탄의 중심·진행 방향·패링 구분을 비교합니다. 실제 본편 표시 함수와 원본 이미지의 통제 배치입니다.</p><div><label><input id="trail" type="checkbox" checked>짧은 꼬리</label><label><input id="fallback" type="checkbox">이미지 미준비 폴백</label><label>시트 프레임 <input id="frame" type="range" min="0" max="15" value="6"><span id="frameNumber">6</span></label></div><p id="status" data-verdict="PENDING">이미지 로드 중</p><div class="grid"><section class="panel"><h2>변경 전</h2><canvas id="before" width="720" height="530"></canvas></section><section class="panel"><h2>현재 후보</h2><canvas id="after" width="720" height="530"></canvas></section></div><footer>전투 판정·속도·발수·패링 조건은 이 검수 도구에서 실행하지 않습니다. 본편 정상 줌·보스전·성능·음향 인수는 별도입니다.</footer><script>
const image=new Image();image.src='../img/proj_firedevil_orb.png';
const oldSource="function _drawDruidParryCue(p,alpha){\n  const kind=_projectileParryClass(p);if(kind==='forbidden')return;\n  const radius=Math.max(9,(p.r||p.sz||4)*1.4),magic=kind==='magic';\n  X.save();try{X.globalAlpha=alpha==null?1:alpha;X.lineWidth=2.5;X.strokeStyle=magic?'#d4a6ff':'#fff0cf';X.fillStyle='#111019d9';X.beginPath();\n    if(magic){X.moveTo(p.x,p.y-radius);X.lineTo(p.x+radius,p.y);X.lineTo(p.x,p.y+radius);X.lineTo(p.x-radius,p.y);X.closePath();}\n    else X.arc(p.x,p.y,radius,0,Math.PI*2);\n    X.fill();X.stroke();X.fillStyle=magic?'#e5c4ff':'#fff0cf';X.font='bold 11px sans-serif';X.textAlign='center';X.textBaseline='middle';X.fillText(keyName(magic?BINDS.parry:BINDS.shield,true),p.x,p.y);\n  }finally{X.restore();}\n}\nlet _druidPoisonFly=null;\nfunction _drawDruidPoisonShot(p,alpha){\n  if(!_druidPoisonFly&&(!_fdFlyImg.complete||!_fdFlyImg.naturalWidth)){\n    // The caller always continues after this draw: never leave an invisible damaging shot.\n    const size=(p._druidMine||p.elemBall?240:Math.max(96,Math.min(180,(p.sz||4)*24)))*_physicalProjectileMultiplier(p,2);\n    X.save();X.globalAlpha=alpha==null?1:alpha;\n    X.fillStyle='#66dd22';X.strokeStyle='#102008';X.lineWidth=3;\n    X.beginPath();X.arc(p.x,p.y,size*.42,0,Math.PI*2);X.fill();X.stroke();\n    X.strokeStyle='#ddffb8';X.lineWidth=Math.max(2,size*.025);\n    X.beginPath();X.arc(p.x,p.y,size*.27,-Math.PI*.85,Math.PI*.35);X.stroke();\n    X.restore();return true;\n  }\n  if(!_druidPoisonFly){\n    const c=document.createElement('canvas');c.width=_fdFlyImg.naturalWidth;c.height=_fdFlyImg.naturalHeight;\n    const cx=c.getContext('2d');cx.filter='grayscale(1)';cx.drawImage(_fdFlyImg,0,0);cx.filter='none';\n    cx.globalCompositeOperation='multiply';cx.fillStyle='#66dd22';cx.fillRect(0,0,c.width,c.height);\n    cx.globalCompositeOperation='destination-in';cx.drawImage(_fdFlyImg,0,0);_druidPoisonFly=c;\n  }\n  const cw=_druidPoisonFly.width/4,ch=_druidPoisonFly.height/4,fr=Math.floor(performance.now()/70)%16;\n  const dw=(p._druidMine||p.elemBall?240:Math.max(96,Math.min(180,(p.sz||4)*24)))*_physicalProjectileMultiplier(p,2),dh=dw*ch/cw;\n  X.save();X.globalAlpha=alpha==null?1:alpha;X.drawImage(_druidPoisonFly,(fr%4)*cw,Math.floor(fr/4)*ch,cw,ch,p.x-dw/2,p.y-dh/2,dw,dh);X.restore();return true;\n}\n",newSource="function _druidPoisonBodySize(p){\n  const mul=_physicalProjectileMultiplier(p,2),large=p._druidMine||p.elemBall;\n  const size=(large?240:Math.max(96,Math.min(180,(p.sz||4)*24)))*mul;\n  return large?size*.6:Math.min(size*.48,Math.max(32,(p.r||p.sz||4)*3.2)*mul);\n}\nfunction _drawDruidParryCue(p,alpha){\n  const kind=_projectileParryClass(p);if(kind==='forbidden')return;\n  const radius=Math.max(9,(p.r||p.sz||4)*1.4),magic=kind==='magic';\n  const core=_druidPoisonBodySize(p),physical=!magic&&!p._druidMine&&!p.elemBall;\n  const ang=Math.atan2(p.vy||0,p.vx||0),w=core*(physical?1.1:1),h=core*(physical?.72:1);\n  const labelY=p.y-(Math.abs(Math.sin(ang))*w+Math.abs(Math.cos(ang))*h)*.5-13;\n  X.save();try{X.globalAlpha=alpha==null?1:alpha;X.globalCompositeOperation='source-over';X.beginPath();\n    if(magic){X.moveTo(p.x,p.y-radius);X.lineTo(p.x+radius,p.y);X.lineTo(p.x,p.y+radius);X.lineTo(p.x-radius,p.y);X.closePath();}\n    else X.arc(p.x,p.y,radius,0,Math.PI*2);\n    X.strokeStyle='#102018';X.lineWidth=4.5;X.stroke();X.strokeStyle=magic?'#d4a6ff':'#fff0cf';X.lineWidth=2.5;X.stroke();\n    X.fillStyle=magic?'#e5c4ff':'#fff0cf';X.font='bold 11px sans-serif';X.textAlign='center';X.textBaseline='middle';\n    const label=keyName(magic?BINDS.parry:BINDS.shield,true);X.strokeStyle='#0a100b';X.lineWidth=4;\n    X.strokeText(label,p.x,labelY);X.fillText(label,p.x,labelY);\n  }finally{X.restore();}\n}\nlet _druidPoisonFly=null;\nfunction _drawDruidPoisonShot(p,alpha){\n  const large=p._druidMine||p.elemBall,mul=_physicalProjectileMultiplier(p,2);\n  const size=(large?240:Math.max(96,Math.min(180,(p.sz||4)*24)))*mul;\n  const core=_druidPoisonBodySize(p),physical=_projectileParryClass(p)==='physical'&&!large;\n  const w=core*(physical?1.1:1),h=core*(physical?.72:1),a=alpha==null?1:alpha;\n  if(!_druidPoisonFly&&_fdFlyImg.complete&&_fdFlyImg.naturalWidth){\n    const c=document.createElement('canvas');c.width=_fdFlyImg.naturalWidth;c.height=_fdFlyImg.naturalHeight;\n    const cx=c.getContext('2d');cx.filter='grayscale(1)';cx.drawImage(_fdFlyImg,0,0);cx.filter='none';\n    cx.globalCompositeOperation='multiply';cx.fillStyle='#66dd22';cx.fillRect(0,0,c.width,c.height);\n    cx.globalCompositeOperation='destination-in';cx.drawImage(_fdFlyImg,0,0);_druidPoisonFly=c;\n  }\n  X.save();try{\n    X.globalCompositeOperation='source-over';X.translate(p.x,p.y);X.rotate(Math.atan2(p.vy||0,p.vx||0));\n    if(_druidPoisonFly){\n      const cw=_druidPoisonFly.width/4,ch=_druidPoisonFly.height/4,fr=Math.floor(performance.now()/70)%16;\n      const sx=(fr%4)*cw,sy=Math.floor(fr/4)*ch,aspect=ch/cw,halo=size*.74;\n      X.globalAlpha=a*.12;X.drawImage(_druidPoisonFly,sx,sy,cw,ch,-halo/2,-halo*aspect/2,halo,halo*aspect);\n      if(OPT.trail&&!large&&(p.vx||p.vy)){\n        const tail=core*(physical?1.2:.8);X.globalAlpha=a*.2;\n        X.drawImage(_druidPoisonFly,sx,sy,cw,ch,-w/2-tail,-h*.35,tail+w*.42,h*.7);\n      }\n      X.globalAlpha=a;if(typeof X.filter==='string')X.filter='brightness(1.35)';\n      X.drawImage(_druidPoisonFly,sx,sy,cw,ch,-w/2,-h*aspect/2,w,h*aspect);\n      if(typeof X.filter==='string')X.filter='none';\n    }else{\n      const halo=X.createRadialGradient(0,0,core*.3,0,0,size*.37);\n      halo.addColorStop(0,'#80cb46');halo.addColorStop(1,'#23491b00');\n      X.globalAlpha=a*.12;X.fillStyle=halo;X.beginPath();X.arc(0,0,size*.37,0,Math.PI*2);X.fill();\n      const body=X.createRadialGradient(w*.08,-h*.1,0,0,0,core*.6);\n      body.addColorStop(0,'#efffcb');body.addColorStop(.25,'#b8f46c');body.addColorStop(.65,'#568c29');body.addColorStop(1,'#12271c');\n      X.globalAlpha=a;X.fillStyle=body;X.beginPath();X.ellipse(0,0,w*.5,h*.5,0,0,Math.PI*2);X.fill();\n    }\n    const glint=X.createRadialGradient(w*.1,-h*.1,0,w*.1,-h*.1,core*.22);\n    glint.addColorStop(0,'#f4ffd4b8');glint.addColorStop(.35,'#b6f57355');glint.addColorStop(1,'#8bdd4000');\n    X.globalAlpha=a;X.fillStyle=glint;X.beginPath();X.ellipse(w*.1,-h*.1,core*.22,core*.18,0,0,Math.PI*2);X.fill();\n  }finally{X.restore();}\n  return true;\n}\n";
const bindings={shield:'E',parry:'Q'},options={trail:true};
let ready=false,clock=420;
function factory(ctx,source,fallback=false){return new Function('X','_fdFlyImg','document','performance','OPT','BINDS','keyName','_projectileParryClass','_physicalProjectileMultiplier',source+';return {shot:_drawDruidPoisonShot,cue:_drawDruidParryCue};')(ctx,fallback?{complete:false,naturalWidth:0}:image,document,{now:()=>clock},options,bindings,x=>x,p=>p.parryClass||'forbidden',(p,m=3)=>!p.friendly&&p.parryClass==='physical'?m:1);}
const samples=[
 ...Array.from({length:5},(_,i)=>({x:100+i*125,y:125,vx:Math.cos(-.6+i*.3)*5,vy:Math.sin(-.6+i*.3)*5,r:8,sz:4,parryClass:'physical',_druidPoison:true})),
 ...Array.from({length:5},(_,i)=>({x:100+i*125,y:290,vx:-2+i,vy:3,r:8,sz:4,parryClass:'magic',_druidPoison:true,blackBean:true})),
 {x:250,y:440,vx:2,vy:0,r:18,sz:24,parryClass:'forbidden',elemBall:true,_druidPoison:true},

];
function draw(id,source){const canvas=document.getElementById(id),ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#142219';ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.strokeStyle='#29372c';ctx.lineWidth=1;for(let y=0;y<canvas.height;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}for(let x=0;x<canvas.width;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
 const renderer=factory(ctx,source,document.getElementById('fallback').checked),start=JSON.stringify(samples),state=[ctx.globalAlpha,ctx.globalCompositeOperation,ctx.filter,JSON.stringify(ctx.getTransform())].join('|');
 for(const p of samples){Object.freeze(p);renderer.shot(p,1);renderer.cue(p,1);}
 const same=state===[ctx.globalAlpha,ctx.globalCompositeOperation,ctx.filter,JSON.stringify(ctx.getTransform())].join('|')&&start===JSON.stringify(samples);
 ctx.fillStyle='#adc0ad';ctx.font='13px sans-serif';ctx.fillText('E 물리 / 원',20,24);ctx.fillText('Q 마법·blackBean / 마름모',20,205);ctx.fillText('대형 에너지·지뢰 / 패링 안내 없음',20,375);return same;}
function render(){if(!ready)return;try{const before=draw('before',oldSource),after=draw('after',newSource);document.getElementById('status').textContent='원본 16프레임 시트 로드 · 상태복구/객체불변 '+(before&&after?'PASS':'FAIL')+' · 통제 배치';document.getElementById('status').dataset.verdict=before&&after?'PASS':'FAIL';}catch(e){document.getElementById('status').textContent='FAIL: '+e.message;document.getElementById('status').dataset.verdict='FAIL';}}
image.onload=()=>{ready=true;render()};image.onerror=()=>{document.getElementById('status').textContent='FAIL: 원본 이미지 로드 실패';document.getElementById('status').dataset.verdict='FAIL';};
document.getElementById('trail').addEventListener('change',e=>{options.trail=e.target.checked;render()});document.getElementById('fallback').addEventListener('change',render);document.getElementById('frame').addEventListener('input',e=>{clock=Number(e.target.value)*70;document.getElementById('frameNumber').textContent=e.target.value;render()});
</script></html>
