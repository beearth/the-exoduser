<!doctype html><html lang="en"><meta charset="utf-8"><base href="../"><title>Warrior subtitle QA</title>
<style>body{background:#111;color:#eee;font:18px sans-serif;padding:24px}button,select{font:inherit;padding:12px}</style>
<h1>Warrior subtitle QA</h1><p>This preview plays the real cinematic without creating or changing a character.</p>
<label>Language <select id="language"><option>ko</option><option selected>en</option></select></label> <button id="play">Play</button><p id="result"></p>
<script src="localization-runtime.js"></script><script src="character-story-player.js"></script>
<script>document.getElementById('play').onclick=async()=>{const language=document.getElementById('language').value;document.getElementById('result').textContent=String(await ExoduserCharacterStory.play({language,skipLabel:language==='ko'?'건너뛰기':'Skip'}));};</script>
